# Default X-UAD configuration (the one used for every reported number).
data:
  root: data
  domain_train: A            # LFW-Sim: identity-disjoint, ID-consistent
  domain_cross: B            # Wild-Sim: colour, in-the-wild, unseen domain
  image_size: 112            # random crop from the 128 px store; centre crop at test
  mask_size: 56
  attack_strength: 0.62      # difficulty-calibrated (see paper, Sec. IV-A)
model:
  dim: 128
  depth: 4
  heads: 4
  mlp_ratio: 2.0
  circuit_depth: 4           # Givens layers per attention circuit
  n_basis: 8                 # quantum evidence basis states
  cdc_theta: 0.7             # central-difference mixing
  spectral_tokens: 4
  dropout: 0.05
  drop_path: 0.05
train:
  epochs: 6
  batch_size: 48
  optimiser: adamw
  lr: 2.5e-3
  weight_decay: 0.02
  schedule: one_cycle
  grad_clip: 3.0
loss:
  cls: 1.0                   # Dirichlet type-II ML + KL to uniform
  loc: 0.6                   # BCE + soft Dice on the evidence mask
  basis: 0.25                # class alignment of the quantum evidence basis
  sup: 0.3                   # bonafide / physical / digital hierarchy
  pues: 0.15                 # pseudo-unseen evidence suppression
  coh: 0.02                  # attention measurement-entropy band
  entropy_band: [0.30, 0.80]
risk:
  severity: [0.00, 0.55, 0.60, 0.85, 0.90, 0.70, 0.75, 0.95]
  unknown_severity: 0.75
  bands: {Low: 0.20, Medium: 0.45, High: 0.70, Critical: inf}
  abstain_vacuity: 0.55
