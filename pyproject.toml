[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xuad"
version = "1.0.0"
description = "X-UAD: Explainable Hybrid Vision Transformer with Adaptive Quantum Attention and Evidence-Grounded Reasoning for Unified Face Attack Detection"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
include = ["xuad*"]
